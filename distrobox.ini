# distrobox.ini for the gott offline speech-to-text app.
#
# Build with:
#   distrobox assemble create --file distrobox.ini
#   distrobox enter gott-dev
#
# Layout:
#   - Base image: Ubuntu 24.04 LTS (noble)
#   - All host-side audio devices are exposed (ALSA + PulseAudio/PipeWire
#     sockets come for free with distrobox's bind mount defaults).
#   - XDG GlobalShortcuts Portal is reachable on Wayland/X11 sessions
#     only if the distrobox inherits DBUS_SESSION_BUS_ADDRESS from the
#     host (distrobox does this by default).
#
# Notes:
#   - We deliberately omit the go compiler from additional_packages:
#     Ubuntu 24.04's main repo ships golang-go (1.22.x) which is older
#     than this project's `go 1.23` module directive. scripts/dev-bootstrap.sh
#     installs Go 1.23 via the official tarball inside post_init_hooks.
#   - libonnxruntime.so is NOT packaged here because v1.18.0 ships under
#     an MIT licence and has many ABI versions; install it via the same
#     post_init_hooks script.

[target.gott-dev]
image = "docker.io/library/ubuntu:24.04"

# Apt packages. golang-go is intentionally omitted — see top-of-file note.
additional_packages = [
  "build-essential",
  "ca-certificates",
  "curl",
  "wget",
  "git",
  "pkg-config",
  "sudo",
  "libasound2-dev",
  "libpulse-dev",
  "libgtk-3-dev",
  "libgtk-3-bin",
  "libayatana-appindicator3-dev",
  "libxdo-dev",
  "libxtst-dev",
  "libgl1-mesa-dev",
  "libegl1-mesa-dev",
  "libxkbcommon-dev",
  "libxkbcommon-x11-0",
  "libvulkan1",
  "mesa-vulkan-drivers",
]

pull       = true
replace    = false
nvidia     = false
home       = true
start_now  = false

# Audio + uinput passthrough so the GUI can hit ALSA / write to the
# virtual-keyboard fallback (uinput backend). `sudo` is reinstalled above
# so the bootstrap script can do privileged symlinks.
additional_flags = [
  "--device=/dev/snd",
  "--device=/dev/uinput",
  "--group-add=audio",
  "--group-add=input",
]

# Bind-mount is enabled by distrobox by default; surface an obvious
# placeholder for an exotic Wayland socket location.
# additional_flags += ["--volume=${XDG_RUNTIME_DIR:-/run/user/1000}/$WAYLAND_DISPLAY:/tmp/wayland-sock"]

# Run shell scripts provided by the project. v1.x of distrobox assemble
# supports these three hook keys; `additional_commands` is NOT supported.
pre_init_hooks  = "scripts/dev-bootstrap-pre.sh"
post_init_hooks = "scripts/dev-bootstrap.sh"
init_hooks      = ""
